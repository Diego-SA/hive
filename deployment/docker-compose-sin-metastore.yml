version: '3.9'
services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: 'metastore_db'
      POSTGRES_USER: 'hive'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    volumes:
      - hive-db:/var/lib/postgresql

  hiveserver2:
    image: apache/hive:local
    restart: unless-stopped
    container_name: hiveserver2
    environment:
      HIVE_SERVER2_THRIFT_PORT: 10000
      SERVICE_OPTS: '-Xmx1G -Dhive.execution.engine=tez'
      IS_RESUME: 'false'
      SERVICE_NAME: 'hiveserver2'
      DB_DRIVER: 'postgres'

    ports:
      - '10000:10000'
      - '10002:10002'
    volumes:
      - warehouse:/opt/hive/data/warehouse
      - type: bind
        source: ${POSTGRES_LOCAL_PATH}
        target: /opt/hive/lib/postgres.jar


volumes:
  hive-db:
  warehouse: